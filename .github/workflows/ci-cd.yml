name: Practice - Build Push Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: equipment-practice-deployment
  cancel-in-progress: false

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v5
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy isolated practice stack
        uses: appleboy/ssh-action@v1.0.3
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          DEPLOY_SHA: ${{ github.sha }}
          APP_IMAGE: ${{ needs.build-image.outputs.image }}
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: REPO_URL,DEPLOY_SHA,APP_IMAGE,REGISTRY_USER,REGISTRY_TOKEN,MYSQL_PASSWORD,MYSQL_ROOT_PASSWORD
          command_timeout: 15m
          script: |
            set -eu
            : "${MYSQL_PASSWORD:?Missing MYSQL_PASSWORD}"
            : "${MYSQL_ROOT_PASSWORD:?Missing MYSQL_ROOT_PASSWORD}"
            target="$HOME/it209-equipment-final-practice"
            if [ ! -d "$target/.git" ]; then
              git clone "$REPO_URL" "$target"
            fi
            cd "$target"
            git fetch origin main
            git checkout --detach "$DEPLOY_SHA"
            export APP_IMAGE
            export APP_TAG="$DEPLOY_SHA"
            export APP_VERSION="$DEPLOY_SHA"
            export MYSQL_PASSWORD MYSQL_ROOT_PASSWORD
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            docker compose --env-file student.env.example config --quiet
            docker compose --env-file student.env.example pull app mysql nginx
            docker compose --env-file student.env.example up -d --no-build
            ready=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:8096/api/equipment; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != true ]; then
              docker compose --env-file student.env.example logs --tail 80 app nginx mysql
              exit 1
            fi
            docker compose --env-file student.env.example ps
            version=$(curl --fail --silent http://127.0.0.1:8096/api/version)
            printf '%s\n' "$version"
            printf '%s\n' "$version" | grep -F "$DEPLOY_SHA"
